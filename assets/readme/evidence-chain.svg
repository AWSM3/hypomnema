<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Hypomnema evidence chain</title>
  <desc id="desc">Sources become candidates, accepted decisions guide artifacts, and verification binds evidence to an artifact checksum before handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#17132d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64d8ff"/>
      <stop offset="0.52" stop-color="#bba7ff"/>
      <stop offset="1" stop-color="#efc96b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bba7ff"/>
    </marker>
    <style>
      .eyebrow { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 2.4px; fill: #8ea0c5; }
      .brand { font: 700 29px Inter, Segoe UI, sans-serif; letter-spacing: 1.6px; fill: #f7f4ff; }
      .node-title { font: 700 16px Inter, Segoe UI, sans-serif; fill: #f7f4ff; }
      .node-copy { font: 13px Inter, Segoe UI, sans-serif; fill: #aab6d3; }
      .handoff { font: 700 15px Inter, Segoe UI, sans-serif; fill: #17132d; }
      .handoff-copy { font: 13px Inter, Segoe UI, sans-serif; fill: #332b4d; }
    </style>
  </defs>

  <rect width="1200" height="410" rx="28" fill="url(#bg)"/>
  <circle cx="1082" cy="73" r="138" fill="#8f79ff" opacity="0.08"/>
  <circle cx="116" cy="360" r="170" fill="#37c8ef" opacity="0.06"/>

  <text x="54" y="50" class="eyebrow">CONTINUITY FOR LONG-RUNNING WORK</text>
  <text x="54" y="84" class="brand">HYPOMNEMA · EVIDENCE CHAIN</text>

  <path d="M 178 190 H 274 M 406 190 H 502 M 634 190 H 730 M 862 190 H 958" stroke="url(#line)" stroke-width="3" fill="none" marker-end="url(#arrow)" opacity="0.9"/>

  <g transform="translate(46 126)">
    <rect width="132" height="128" rx="18" fill="#121b31" stroke="#4facc8" stroke-width="1.5"/>
    <circle cx="66" cy="31" r="10" fill="#64d8ff" filter="url(#glow)"/>
    <text x="66" y="66" text-anchor="middle" class="node-title">SOURCE</text>
    <text x="66" y="90" text-anchor="middle" class="node-copy">provenance</text>
    <text x="66" y="109" text-anchor="middle" class="node-copy">freshness</text>
  </g>

  <g transform="translate(274 126)">
    <rect width="132" height="128" rx="18" fill="#171a36" stroke="#756cd0" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="M66 21 L76 39 L56 39 Z" fill="#9588f4"/>
    <text x="66" y="66" text-anchor="middle" class="node-title">CANDIDATE</text>
    <text x="66" y="90" text-anchor="middle" class="node-copy">inference</text>
    <text x="66" y="109" text-anchor="middle" class="node-copy">unknowns</text>
  </g>

  <g transform="translate(502 126)">
    <rect width="132" height="128" rx="18" fill="#1d1938" stroke="#aa8dea" stroke-width="1.5"/>
    <path d="M56 31 l7 7 15-17" fill="none" stroke="#c6a8ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="66" text-anchor="middle" class="node-title">DECISION</text>
    <text x="66" y="90" text-anchor="middle" class="node-copy">accepted</text>
    <text x="66" y="109" text-anchor="middle" class="node-copy">with evidence</text>
  </g>

  <g transform="translate(730 126)">
    <rect width="132" height="128" rx="18" fill="#211b34" stroke="#d0a767" stroke-width="1.5"/>
    <rect x="54" y="21" width="24" height="22" rx="4" fill="none" stroke="#efc96b" stroke-width="2"/>
    <text x="66" y="66" text-anchor="middle" class="node-title">ARTIFACT</text>
    <text x="66" y="90" text-anchor="middle" class="node-copy">lineage</text>
    <text x="66" y="109" text-anchor="middle" class="node-copy">SHA-256</text>
  </g>

  <g transform="translate(958 126)">
    <rect width="196" height="128" rx="18" fill="#251e30" stroke="#efc96b" stroke-width="1.8"/>
    <circle cx="98" cy="31" r="12" fill="none" stroke="#efc96b" stroke-width="2"/>
    <path d="M91 31 l5 5 10-12" fill="none" stroke="#efc96b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="98" y="66" text-anchor="middle" class="node-title">VERIFICATION</text>
    <text x="98" y="90" text-anchor="middle" class="node-copy">report / evidence</text>
    <text x="98" y="109" text-anchor="middle" class="node-copy">subject checksum</text>
  </g>

  <path d="M 568 254 V 292" stroke="#bba7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="238" y="300" width="724" height="72" rx="20" fill="url(#line)"/>
  <text x="270" y="332" class="handoff">HANDOFF</text>
  <text x="270" y="354" class="handoff-copy">goal · latest summary · decisions · outputs · verification · unresolved · next action</text>
  <path d="M 903 326 h22 v20 h-22" fill="none" stroke="#332b4d" stroke-width="2" stroke-linecap="round"/>
  <path d="M 893 336 h30" stroke="#332b4d" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
